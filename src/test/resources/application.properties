# Override for @DataJpaTest: use H2-compatible settings instead of MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Disable Kafka auto-configuration for tests (unless using @EmbeddedKafka)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.bootstrap-servers=localhost:9092

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Allow bean definition overriding for tests
spring.main.allow-bean-definition-overriding=true

# Temporal Configuration
temporal.worker.enabled=false
temporal.target=127.0.0.1:7233
temporal.task-queue=file-upload-task-queue

# fs = file system directory
file.upload-dir=uploads
ml_dir=src/main/resources/ml/code/cocosynth/datasets
ml_dummy_source_dir=src/main/resources/default_ml_structure
ml_dummy_destination_dir=src/main/resources/ml/code/cocosynth/datasets
ml_sub_dir=input/foregrounds
ml_dataset_count=250
ml_permanent_prefix=src/main/resources/ml/code/cocosynth/models
ml_permanent_suffix=output
ml_coco_model_name=cocosynth_model.pth
ml_coco_metadata_name=cocosynth_model_metadata.json

training_batch-size=4
training_epochs=2
training_max-image-size=1024
