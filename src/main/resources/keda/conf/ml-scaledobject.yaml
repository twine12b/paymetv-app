apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ml-trainer
  namespace: ml
spec:
  scaleTargetRef:
    name: ml-trainer
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 180
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: ml-trainer
