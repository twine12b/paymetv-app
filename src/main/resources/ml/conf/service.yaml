apiVersion: v1
kind: Service
metadata:
  name: ml-trainer
  namespace: ml
  labels:
    app: ml-trainer
spec:
  type: ClusterIP
  selector:
    app: ml-trainer
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# In-cluster callers use this endpoint so their requests pass through the
# KEDA HTTP interceptor and contribute to the scaling metric.
apiVersion: v1
kind: Service
metadata:
  name: ml-trainer-proxy
  namespace: ml
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
