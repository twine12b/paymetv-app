# Apply instead of deployment.yaml when the cluster has NVIDIA GPU nodes and
# the NVIDIA device plugin/runtime installed. Uses the same Deployment name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-trainer
  namespace: ml
  labels:
    app: ml-trainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-trainer
  template:
    metadata:
      labels:
        app: ml-trainer
    spec:
      terminationGracePeriodSeconds: 3600
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: ml-trainer
          image: paymetv/ml-trainer:cuda
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ML_DATASETS_DIR
              value: /data/datasets
            - name: ML_MODELS_DIR
              value: /data/models
            - name: TRAINING_CONCURRENCY
              value: "1"
            - name: ML_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ml-api-auth
                  key: token
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: ml-data
              mountPath: /data
      volumes:
        - name: ml-data
          persistentVolumeClaim:
            claimName: ml-data
