apiVersion: apps/v1
kind: Deployment
metadata:
  name: lighttpd
  namespace: streaming
  labels:
    app: lighttpd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lighttpd
  template:
    metadata:
      labels:
        app: lighttpd
    spec:
      containers:
        - name: lighttpd
          image: paymetv/streaming-app:latest
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: UID
              value: "100"
            - name: GID
              value: "101"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: www-data
              mountPath: /var/www
      volumes:
        - name: www-data
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lighttpd
  namespace: streaming
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: pmtv-selfsigned-issuer
spec:
  ingressClassName: nginx
  tls:
    - secretName: pmtv-ss-sec
      hosts:
        - paymetv.co.uk
  rules:
    - host: paymetv.co.uk
      http:
        paths:
          - path: /streaming(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: lighttpd
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lighttpd
  namespace: streaming
  labels:
    app: lighttpd
spec:
  type: LoadBalancer
  selector:
    app: lighttpd
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
